name: Generate app icons

on:
  push:
    paths:
      - 'icon.svg'
      - '.github/workflows/generate-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install sharp
      - name: Generate PNG icons
        run: |
          node <<'NODE'
          const sharp = require('sharp');
          const fs = require('fs');
          const svg = fs.readFileSync('icon.svg');
          Promise.all([
            sharp(svg).resize(180,180).png().toFile('icon-180.png'),
            sharp(svg).resize(192,192).png().toFile('icon-192.png'),
            sharp(svg).resize(512,512).png().toFile('icon-512.png')
          ]).then(() => console.log('Icons generated.'));
          NODE
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-180.png icon-192.png icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m "Generate PNG app icons"
          git push
